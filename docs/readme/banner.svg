<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" width="1280" height="420" role="img" aria-label="Raiz Conecta: um mercado solicita 120 kg de tomate; dois produtores oferecem 80 kg e 40 kg e completam o pedido">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#052d1b"/><stop offset="1" stop-color="#07502a"/></linearGradient>
 <pattern id="grade" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#86efac" stroke-opacity=".09" stroke-width="1"/></pattern>
 <filter id="shadow" x="-40%" y="-45%" width="180%" height="200%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#001910" flood-opacity=".55"/></filter>
 <linearGradient id="pill" x1="0" x2="1"><stop stop-color="#087339"/><stop offset="1" stop-color="#0f9f4c"/></linearGradient>
</defs>
<style>
 .head{font:800 65px 'Segoe UI',Arial,sans-serif;letter-spacing:-2px;fill:white}
 .tag{font:500 25px 'Segoe UI',Arial,sans-serif;fill:#ecfdf5}
 .small{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#d1fae5}
 .cardTitle{font:700 15px 'Segoe UI',Arial,sans-serif;fill:#123623}
 .cardSmall{font:600 13px 'Segoe UI',Arial,sans-serif;fill:#365e46}
 .amount{font:800 25px 'Segoe UI',Arial,sans-serif;fill:#0f5131}
 .connector{fill:none;stroke:#82f88b;stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:11 9;animation:flow 5s linear infinite}
 .fade{animation:show 6s ease-in-out infinite;transform-origin:center}
 .delay{animation-delay:.7s}
 .bar{animation:grow 6s ease-out infinite;transform-box:fill-box;transform-origin:left center}
 .pulse{animation:glow 3s ease-in-out infinite}
 @keyframes flow{to{stroke-dashoffset:-160}}
 @keyframes show{0%{opacity:.4}35%,85%{opacity:1}100%{opacity:.4}}
 @keyframes grow{0%,12%{transform:scaleX(.1)}40%,90%{transform:scaleX(1)}100%{transform:scaleX(.1)}}
 @keyframes glow{0%,100%{opacity:.76}50%{opacity:1}}
 @media(prefers-reduced-motion:reduce){.connector,.fade,.bar,.pulse{animation:none}}
</style>
<rect width="1280" height="420" rx="23" fill="url(#bg)"/><rect width="1280" height="420" rx="23" fill="url(#grade)"/>
<path d="M0 366 Q150 312 320 375 T675 350 T1280 381 V420H0Z" fill="#128542" opacity=".18"/>
<path d="M0 390 Q170 347 325 404 T690 379 T1280 390 V420H0Z" fill="#74ce4a" opacity=".13"/>
<!-- Simplified sprout brand symbol -->
<g transform="translate(76 53)"><path d="M19 54V18" stroke="#81fb78" stroke-width="6" stroke-linecap="round"/><path d="M19 28C0 28 -7 16 0 2 17 2 25 13 19 28Z" fill="#5ceb6c"/><path d="M21 20C24 -1 42 -5 53 2 51 20 36 30 21 20Z" fill="#95ff7a"/></g>
<text x="148" y="97" class="head">Raiz Conecta</text>
<text x="77" y="174" class="tag">Mercados e produtores</text>
<text x="77" y="212" class="tag">da sua região,</text>
<text x="77" y="254" font-family="Segoe UI,Arial,sans-serif" font-size="34" font-weight="800" fill="#96ff74">conectados.</text>
<text x="77" y="311" class="small">Pedidos e ofertas diretas, sem atravessadores.</text>
<path d="M610 58V337" stroke="#6ee7b7" stroke-opacity=".35" stroke-width="2" stroke-dasharray="6 8"/>
<!-- Market and producers -->
<g font-family="Segoe UI,Arial,sans-serif" font-size="19" font-weight="700" fill="#e4fdeb"><text x="687" y="66">Mercado</text><text x="1023" y="66">Produtores</text></g>
<!-- Branching connection strokes -->
<path class="connector" d="M895 211 C953 211 964 140 996 140"/>
<path class="connector" d="M895 211 C953 211 964 269 996 269"/>
<!-- Market card -->
<g filter="url(#shadow)"><rect x="643" y="145" width="252" height="139" rx="18" fill="#fff"/><rect x="660" y="167" width="49" height="48" rx="11" fill="#dcfce7"/></g>
<g transform="translate(674 178)" stroke="#075e32" stroke-width="2.6" fill="none" stroke-linejoin="round" stroke-linecap="round"><path d="M1 14L4 4H31L35 14"/><path d="M1 14H35V32H1Z"/><path d="M9 32V21H25V32"/><path d="M1 14Q7 21 13 14Q19 21 24 14Q30 21 35 14"/></g>
<text x="723" y="178" class="cardTitle">Mercado solicita</text><text x="723" y="208" class="amount">120 kg</text><text x="723" y="231" class="cardSmall">de tomate</text><rect x="661" y="255" width="215" height="8" rx="4" fill="#e2ebe4"/>
<!-- Producer card 1 -->
<g class="fade" filter="url(#shadow)"><rect x="997" y="96" width="245" height="106" rx="17" fill="#fff"/><rect x="1011" y="108" width="39" height="40" rx="10" fill="#e1fce7"/>
<path d="M1031 141V120M1031 130Q1021 131 1019 122Q1027 119 1031 130ZM1031 126Q1040 127 1042 118Q1035 116 1031 126Z" fill="#16a34a" stroke="#15803d" stroke-width="1.4"/>
<text x="1060" y="123" class="cardTitle">Sítio Boa Vista</text><text x="1060" y="148" class="amount">80 kg</text><rect x="1014" y="171" width="205" height="9" rx="5" fill="#dbe6df"/><rect class="bar" x="1014" y="171" width="138" height="9" rx="5" fill="#0ea34f"/></g>
<!-- Producer card 2 -->
<g class="fade delay" filter="url(#shadow)"><rect x="997" y="220" width="245" height="107" rx="17" fill="#fff"/><rect x="1011" y="234" width="39" height="40" rx="10" fill="#e1fce7"/>
<path d="M1031 267V246M1031 256Q1021 257 1019 248Q1027 245 1031 256ZM1031 252Q1040 253 1042 244Q1035 242 1031 252Z" fill="#16a34a" stroke="#15803d" stroke-width="1.4"/>
<text x="1060" y="249" class="cardTitle">Horta da Região</text><text x="1060" y="274" class="amount">40 kg</text><rect x="1014" y="297" width="205" height="9" rx="5" fill="#dbe6df"/><rect class="bar" x="1014" y="297" width="67" height="9" rx="5" fill="#19b765"/></g>
<g class="pulse"><rect x="830" y="356" width="285" height="44" rx="22" fill="url(#pill)" stroke="#64ff89" stroke-width="1.3"/>
<circle cx="853" cy="378" r="14" fill="#fff"/><path d="M846 378L852 383L862 372" fill="none" stroke="#078540" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="875" y="386" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">Pedido atendido</text></g>
</svg>